name: Zendesk Agent CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Regression Gate
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate synthetic data
        run: python synthetic_data/ticket_generator.py

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=memory --cov=skills --cov=guardrails --cov=rl_pipeline

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          REDIS_HOST: localhost

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

      - name: Regression gate
        run: |
          if [ -f data/latest_eval_report.json ]; then
            python -m evaluation.regression_gate data/latest_eval_report.json
          else
            echo "No eval report found — skipping regression gate on first run"
          fi
